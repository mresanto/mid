name: cli-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            cargo build --release --target x86_64-pc-windows-msvc
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cargo build --release
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            binary="target/release/mid"
            package_name="mid"
          else
            binary="target/${{ matrix.target }}/release/mid"
            package_name="mid_macos"
          fi
          test -x "$binary"
          if [[ "${{ matrix.target }}" == *musl* ]]; then file "$binary" | grep -qi static; fi
          mkdir -p out
          cp "$binary" "out/$package_name"
          tar -C out -czf "mid-${{ matrix.target }}.tar.gz" "$package_name"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mid.exe" out/mid_msvc.exe
          Compress-Archive -Path "out/mid_msvc.exe" -DestinationPath "mid-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            mid-*.tar.gz
            mid-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum mid-*.tar.gz mid-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/mid-*.tar.gz
            dist/mid-*.zip
            dist/SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/mid-*.tar.gz
            dist/mid-*.zip
            dist/SHA256SUMS

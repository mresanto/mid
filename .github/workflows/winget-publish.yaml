
name: Publish WinGet Update

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (for example, v0.1.3)"
        required: true

permissions:
  contents: read

jobs:
  winget:
    name: Update WinGet Package
    runs-on: windows-latest

    steps:
      - name: Download WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "wingetcreate.exe"

      - name: Submit WinGet update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: mresanto.mid
          ASSET_NAME: mid_msvc.exe
        run: |
          $tag = "${{ github.event.inputs.tag || github.event.release.tag_name }}"

          if (-not $tag) {
            throw "A release tag is required"
          }

          $version = $tag -replace '^v', ''

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$env:ASSET_NAME"
          $url = "$url|x64|user"

          if (-not $env:WINGET_TOKEN) {
            throw "Missing WINGET_TOKEN secret"
          }

          Write-Host "Package: $env:PACKAGE_ID"
          Write-Host "Version: $version"
          Write-Host "Installer: $url"

          .\wingetcreate.exe update $env:PACKAGE_ID `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_TOKEN
